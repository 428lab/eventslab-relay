name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg (for the end-to-end test's audio path)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build (darwin/arm64, darwin/amd64, windows/amd64)
        run: |
          for t in darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null .
          done
